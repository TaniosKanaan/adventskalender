<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventskalender</title>
<style>
  :root { color-scheme: light; --bg: #f6f1ea; --ink: #241c18; --card: #fffdf9; --line: #e4d9cc; --ja: #1f6b45; --nein: #8a8178; --alt: #8d4b63; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.4 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { max-width: 720px; margin: 0 auto; padding: 28px 16px 8px; }
  h1 { font-size: 32px; margin: 0 0 6px; }
  header p { margin: 0; color: #5c5148; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  img { width: 100%; height: 280px; object-fit: contain; background: #fff; display: block; }
  .body { padding: 14px 14px 16px; }
  .n { font-size: 13px; letter-spacing: .04em; color: #8d4b63; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  a.produkt { color: var(--alt); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; min-height: 44px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: inherit; cursor: pointer; }
  button[aria-pressed="true"][data-choice="ja"] { background: var(--ja); color: #fff; border-color: var(--ja); }
  button[aria-pressed="true"][data-choice="nein"] { background: var(--nein); color: #fff; border-color: var(--nein); }
  button[aria-pressed="true"][data-choice="alt"] { background: var(--alt); color: #fff; border-color: var(--alt); }
  .alt { display: none; margin-top: 10px; }
  .alt.on { display: block; }
  input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
  .alt a { display: inline-block; margin-top: 8px; word-break: break-all; }
  #status { max-width: 720px; margin: 0 auto; padding: 0 16px 28px; color: #5c5148; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Adventskalender</h1>
  <p>Ja, nein, oder ein Link zu einer Alternative.</p>
</header>
<main id="list"></main>
<p id="status"></p>
<script>
const SB_URL = "https://cgvjrswhgdpdrfuhpnkb.supabase.co";
const SB_KEY = "sb_publishable_gWZOM4q4sVm1Fl9G9Dw6dw_TPn3Uk3u";
const picks = {};
const status = document.getElementById("status");

function headers() {
  return { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", Prefer: "return=minimal" };
}

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

function card(row) {
  const product = row.products || {};
  return `
  <article data-n="${row.n}">
    ${product.img ? `<img src="${esc(product.img)}" alt="">` : ""}
    <div class="body">
      <p class="n">Tür ${row.n}</p>
      <h2>${esc(product.name || "")}</h2>
      ${product.href ? `<a class="produkt" href="${esc(product.href)}" target="_blank" rel="noopener">Produkt</a>` : ""}
      <div class="row">
        <button type="button" data-choice="ja" aria-pressed="false">Ja</button>
        <button type="button" data-choice="nein" aria-pressed="false">Nein</button>
        <button type="button" data-choice="alt" aria-pressed="false">Alternative</button>
      </div>
      <div class="alt">
        <input type="text" placeholder="Link oder Anweisung">
        <a hidden target="_blank" rel="noopener"></a>
      </div>
    </div>
  </article>`;
}

async function load() {
  const res = await fetch(SB_URL + "/rest/v1/picks?select=n,choice,alt_url,products(name,href,img)&order=n", { headers: headers() });
  if (!res.ok) throw new Error("load");
  const rows = await res.json();
  document.getElementById("list").innerHTML = rows.map(card).join("");
  for (const row of rows) picks[row.n] = { choice: row.choice, alt: row.alt_url || "" };
  status.textContent = "Für alle sichtbar, die diese Seite öffnen.";
}

function paint(n) {
  const card = document.querySelector('[data-n="' + n + '"]');
  const pick = picks[n] || {};
  card.querySelectorAll("button").forEach((btn) => {
    btn.setAttribute("aria-pressed", String(btn.dataset.choice === pick.choice));
  });
  const box = card.querySelector(".alt");
  box.classList.toggle("on", pick.choice === "alt" || !!pick.alt);
  const input = box.querySelector("input");
  if (document.activeElement !== input) input.value = pick.alt || "";
  const link = box.querySelector("a");
  const ok = /^https:\/\//i.test(pick.alt || "");
  link.hidden = !ok;
  if (ok) { link.href = pick.alt; link.textContent = pick.alt; }
}

async function save(n) {
  const pick = picks[n] || {};
  const alt = pick.alt ? pick.alt.slice(0, 500) : null;
  const res = await fetch(SB_URL + "/rest/v1/picks?n=eq." + n, {
    method: "PATCH",
    headers: headers(),
    body: JSON.stringify({ choice: pick.choice || null, alt_url: alt })
  });
  if (!res.ok) throw new Error("save");
}

function choose(n, choice) {
  const pick = picks[n] || { choice: null, alt: "" };
  pick.choice = pick.choice === choice ? null : choice;
  picks[n] = pick;
  paint(n);
  save(n).catch(() => { status.textContent = "Speichern hat nicht geklappt."; });
}

function setAlt(n, value) {
  const text = value.trim().slice(0, 500);
  const pick = picks[n] || { choice: "alt", alt: "" };
  if (!text) {
    pick.choice = "alt";
    pick.alt = "";
    picks[n] = pick;
    paint(n);
    save(n).catch(() => { status.textContent = "Speichern hat nicht geklappt."; });
    return;
  }
  if (!/^https:\/\//i.test(text)) {
    pick.choice = "alt";
    pick.alt = text;
    picks[n] = pick;
    paint(n);
    save(n).catch(() => { status.textContent = "Speichern hat nicht geklappt."; });
    return;
  }
  fetch(SB_URL + "/rest/v1/products?n=eq." + n, {
    method: "PATCH",
    headers: headers(),
    body: JSON.stringify({ href: text })
  }).then((res) => {
    if (!res.ok) throw new Error("product");
    const card = document.querySelector('[data-n="' + n + '"]');
    let link = card.querySelector("a.produkt");
    if (!link) {
      link = document.createElement("a");
      link.className = "produkt";
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "Produkt";
      card.querySelector("h2").after(link);
    }
    link.href = text;
    pick.choice = "ja";
    pick.alt = text;
    picks[n] = pick;
    paint(n);
    return save(n);
  }).catch(() => { status.textContent = "Speichern hat nicht geklappt."; });
}

document.getElementById("list").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  choose(Number(btn.closest("article").dataset.n), btn.dataset.choice);
});
document.getElementById("list").addEventListener("change", (e) => {
  if (e.target.tagName !== "INPUT") return;
  setAlt(Number(e.target.closest("article").dataset.n), e.target.value);
});

load().then(() => Object.keys(picks).forEach((n) => paint(Number(n)))).catch(() => { status.textContent = "Die Produkte konnten nicht geladen werden."; });
</script>
</body>
</html>
